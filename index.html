<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Pickleball Palace — Live Ads Dashboard</title>
<style>
  :root{
    color-scheme: light;
    --surface-1:#ffffff;
    --plane:#f4f6f8;
    --card-ring:rgba(11,11,11,.09);
    --text-primary:#0b0f14;
    --text-secondary:#52606d;
    --muted:#7b8794;
    --grid:#e6eaee;
    --baseline:#c3ccd4;
    --series-1:#2a78d6;
    --series-2:#eb6834;
    --good:#0ca30c;
    --warning:#fab219;
    --critical:#d03b3b;
    --brand-1:#0f2b46;
    --brand-2:#1baf7a;
    --shadow:0 1px 2px rgba(16,24,40,.05), 0 8px 24px -12px rgba(16,24,40,.18);
    --radius:16px;
  }
  @media (prefers-color-scheme: dark){
    :root:where(:not([data-theme="light"])){
      color-scheme: dark;
      --surface-1:#12171f;
      --plane:#0b0e13;
      --card-ring:rgba(255,255,255,.10);
      --text-primary:#ffffff;
      --text-secondary:#c3c9d2;
      --muted:#8b95a1;
      --grid:#222932;
      --baseline:#333c47;
      --series-1:#3987e5;
      --series-2:#d95926;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --surface-1:#12171f; --plane:#0b0e13; --card-ring:rgba(255,255,255,.10);
    --text-primary:#ffffff; --text-secondary:#c3c9d2; --muted:#8b95a1;
    --grid:#222932; --baseline:#333c47; --series-1:#3987e5; --series-2:#d95926;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--plane);
    color:var(--text-primary);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1120px;margin:0 auto;padding:0 20px 64px}

  /* ---------- header ---------- */
  .hero{
    background:linear-gradient(135deg,var(--brand-1) 0%,#153c61 55%,#10604a 100%);
    color:#fff;padding:36px 0 76px;margin-bottom:-52px;
  }
  .hero-inner{max-width:1120px;margin:0 auto;padding:0 20px;
    display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;justify-content:space-between}
  .brandline{display:flex;align-items:center;gap:12px}
  .ball{width:34px;height:34px;border-radius:50%;background:#d7f24a;position:relative;flex:none;
        box-shadow:0 2px 10px rgba(0,0,0,.25)}
  .ball::before,.ball::after{content:"";position:absolute;inset:0;border-radius:50%;
    background:
      radial-gradient(circle at 30% 30%, rgba(0,0,0,.28) 2.2px, transparent 2.6px),
      radial-gradient(circle at 68% 34%, rgba(0,0,0,.28) 2.2px, transparent 2.6px),
      radial-gradient(circle at 32% 68%, rgba(0,0,0,.28) 2.2px, transparent 2.6px),
      radial-gradient(circle at 70% 70%, rgba(0,0,0,.28) 2.2px, transparent 2.6px),
      radial-gradient(circle at 50% 50%, rgba(0,0,0,.28) 2.2px, transparent 2.6px);
  }
  h1{font-size:1.5rem;margin:0;letter-spacing:-.02em;font-weight:650}
  .sub{color:rgba(255,255,255,.72);font-size:.875rem;margin-top:2px}
  .hero-meta{text-align:right;font-size:.8125rem;color:rgba(255,255,255,.78)}
  .livepill{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.14);
    border:1px solid rgba(255,255,255,.22);padding:5px 12px;border-radius:999px;
    font-weight:600;font-size:.8125rem;color:#fff;backdrop-filter:blur(4px)}
  .dot{width:8px;height:8px;border-radius:50%;background:#3ee07f;flex:none;
       box-shadow:0 0 0 0 rgba(62,224,127,.7);animation:pulse 2.4s infinite}
  @keyframes pulse{70%{box-shadow:0 0 0 8px rgba(62,224,127,0)}100%{box-shadow:0 0 0 0 rgba(62,224,127,0)}}

  /* ---------- cards ---------- */
  .card{background:var(--surface-1);border:1px solid var(--card-ring);border-radius:var(--radius);
        box-shadow:var(--shadow);position:relative}
  section{margin-top:26px}
  h2{font-size:.8125rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);
     margin:0 0 12px 2px;font-weight:650}

  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .kpi{padding:18px 18px 16px}
  .kpi .label{font-size:.8125rem;color:var(--text-secondary);font-weight:550;display:flex;align-items:center;gap:6px}
  .kpi .value{font-size:2.125rem;font-weight:680;letter-spacing:-.03em;margin-top:6px;line-height:1.1}
  .kpi .foot{font-size:.75rem;color:var(--muted);margin-top:5px}
  .accent{position:absolute;left:18px;right:18px;top:0;height:3px;border-radius:0 0 3px 3px}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .pad{padding:20px}

  .row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--grid);font-size:.875rem}
  .row:last-child{border-bottom:0}
  .row .k{color:var(--text-secondary)}
  .row .v{font-weight:600;text-align:right}

  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
  .chip{background:var(--plane);border:1px solid var(--card-ring);border-radius:999px;
        padding:5px 11px;font-size:.8125rem;color:var(--text-secondary);font-weight:550}

  .status{display:inline-flex;align-items:center;gap:6px;font-weight:620;font-size:.8125rem}
  .status svg{flex:none}

  /* ---------- charts ---------- */
  .chartcard{padding:20px}
  .chart-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px}
  .chart-title{font-size:.9375rem;font-weight:640}
  .chart-total{font-size:.8125rem;color:var(--muted);font-variant-numeric:tabular-nums}
  svg.plot{display:block;width:100%;height:170px;overflow:visible}
  .empty{height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;
         text-align:center;gap:6px;color:var(--muted);font-size:.8125rem;
         border:1px dashed var(--grid);border-radius:12px;margin-top:12px;padding:12px}
  .empty strong{color:var(--text-secondary);font-size:.875rem;font-weight:620}
  .tip{position:fixed;pointer-events:none;background:var(--surface-1);color:var(--text-primary);
       border:1px solid var(--card-ring);border-radius:10px;padding:8px 11px;font-size:.8125rem;
       box-shadow:var(--shadow);opacity:0;transition:opacity .12s;z-index:60;white-space:nowrap}
  .tip .tdate{color:var(--muted);font-size:.75rem;margin-bottom:2px}
  .tip .tval{font-weight:660;font-variant-numeric:tabular-nums}

  /* ---------- creatives ---------- */
  .ads{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .ad{overflow:hidden;display:flex;flex-direction:column}
  .adtop{display:flex;gap:14px;padding:16px}
  .thumb{width:104px;height:104px;border-radius:12px;object-fit:cover;flex:none;
         background:var(--plane);border:1px solid var(--card-ring)}
  .thumb-ph{width:104px;height:104px;border-radius:12px;flex:none;background:var(--plane);
            border:1px solid var(--card-ring);display:flex;align-items:center;justify-content:center;
            color:var(--muted);font-size:.6875rem}
  .adname{font-size:.75rem;color:var(--muted);margin-bottom:3px}
  .adhead{font-weight:640;font-size:.9375rem;line-height:1.3;letter-spacing:-.01em}
  .adbody{font-size:.8125rem;color:var(--text-secondary);margin-top:7px;white-space:pre-line;
          display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
  .adstats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--grid);margin-top:auto}
  .adstat{padding:11px 8px;text-align:center;border-right:1px solid var(--grid)}
  .adstat:last-child{border-right:0}
  .adstat .n{font-weight:660;font-size:.9375rem;font-variant-numeric:tabular-nums}
  .adstat .l{font-size:.6875rem;color:var(--muted);margin-top:1px}
  .badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .badge{font-size:.6875rem;font-weight:620;padding:3px 8px;border-radius:6px;
         background:var(--plane);border:1px solid var(--card-ring);color:var(--text-secondary)}

  footer{margin-top:34px;text-align:center;color:var(--muted);font-size:.75rem;line-height:1.7}
  a{color:inherit}
  .skel{background:linear-gradient(90deg,var(--grid) 25%,var(--plane) 50%,var(--grid) 75%);
        background-size:200% 100%;animation:sh 1.4s infinite;border-radius:6px;color:transparent!important}
  @keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}

  @media (max-width:860px){
    .kpis{grid-template-columns:1fr 1fr}
    .grid2,.ads{grid-template-columns:1fr}
    .hero-meta{text-align:left}
  }
  @media (max-width:430px){
    .kpi .value{font-size:1.75rem}
    .adtop{flex-direction:column}
    .thumb,.thumb-ph{width:100%;height:180px}
  }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-inner">
    <div class="brandline">
      <div class="ball" aria-hidden="true"></div>
      <div>
        <h1>Pickleball Palace</h1>
        <div class="sub">Meta Ads &middot; Live Performance Dashboard</div>
      </div>
    </div>
    <div class="hero-meta">
      <span class="livepill"><span class="dot"></span><span id="livetxt">Live</span></span>
      <div style="margin-top:8px" id="updated">Loading…</div>
      <div style="opacity:.75">Refreshes nightly at 8:00 PM</div>
    </div>
  </div>
</div>

<div class="wrap">

  <section>
    <div class="kpis" id="kpis"></div>
  </section>

  <section>
    <h2>Campaign</h2>
    <div class="grid2">
      <div class="card pad" id="campaigncard"></div>
      <div class="card pad" id="targetcard"></div>
    </div>
  </section>

  <section>
    <h2>Performance — last 30 days</h2>
    <div class="grid2">
      <div class="card chartcard" id="leadschart"></div>
      <div class="card chartcard" id="spendchart"></div>
    </div>
  </section>

  <section>
    <h2>Live creative</h2>
    <div class="ads" id="ads"></div>
  </section>

  <footer>
    Reporting straight from the Meta Ads API &middot; figures in AUD<br>
    Managed by <strong>Jarrod Brake</strong> &middot; <span id="acctline"></span>
  </footer>
</div>

<div class="tip" id="tip"></div>

<script>
const ENDPOINT = "https://sqfepgxaurtkqftknobl.supabase.co/functions/v1/pickleball-public";

const money = (n, dp) => "$" + (Number(n)||0).toLocaleString("en-AU",
  {minimumFractionDigits: dp===undefined?2:dp, maximumFractionDigits: dp===undefined?2:dp});
const int = n => (Number(n)||0).toLocaleString("en-AU");
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const STATUS = {
  ACTIVE:        {label:"Active",           color:"var(--good)",     icon:"check"},
  PENDING_REVIEW:{label:"In review",        color:"var(--warning)",  icon:"clock"},
  IN_PROCESS:    {label:"In review",        color:"var(--warning)",  icon:"clock"},
  PAUSED:        {label:"Paused",           color:"var(--muted)",    icon:"pause"},
  DISAPPROVED:   {label:"Disapproved",      color:"var(--critical)", icon:"alert"},
  WITH_ISSUES:   {label:"Needs attention",  color:"var(--critical)", icon:"alert"},
  CAMPAIGN_PAUSED:{label:"Campaign paused", color:"var(--muted)",    icon:"pause"},
  ADSET_PAUSED:  {label:"Ad set paused",    color:"var(--muted)",    icon:"pause"}
};
const ICONS = {
  check:'<path d="M13.5 4.5 6 12 2.5 8.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>',
  clock:'<circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M8 4.6V8l2.4 1.6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>',
  pause:'<rect x="4.5" y="3.5" width="2.6" height="9" rx="1" fill="currentColor"/><rect x="8.9" y="3.5" width="2.6" height="9" rx="1" fill="currentColor"/>',
  alert:'<path d="M8 2.4 15 13.6H1z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/><path d="M8 6.6v3" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><circle cx="8" cy="11.6" r="1" fill="currentColor"/>'
};
// Status is never colour-alone: every pill ships an icon + a text label.
function statusPill(raw){
  const s = STATUS[raw] || {label: raw ? String(raw).replace(/_/g," ").toLowerCase() : "Unknown",
                            color:"var(--muted)", icon:"clock"};
  return `<span class="status" style="color:${s.color}">
    <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true">${ICONS[s.icon]}</svg>${esc(s.label)}</span>`;
}

function kpiTile(label, value, foot, accent){
  return `<div class="card kpi">
    <div class="accent" style="background:${accent}"></div>
    <div class="label">${esc(label)}</div>
    <div class="value">${value}</div>
    <div class="foot">${foot}</div>
  </div>`;
}

/* ---------- chart: single series, no dual axis, hover crosshair ---------- */
function lineChart(el, rows, key, opts){
  const W = 560, H = 170, P = {t:14, r:12, b:22, l:opts.padLeft||42};
  const pts = rows.map(r => ({x:r.date, y:Number(r[key])||0}));
  const total = pts.reduce((a,b)=>a+b.y,0);

  el.innerHTML = `<div class="chart-head">
      <span class="chart-title">${esc(opts.title)}</span>
      <span class="chart-total">${opts.fmtTotal(total)}</span>
    </div>`;

  if(!pts.length){
    el.insertAdjacentHTML("beforeend",
      `<div class="empty"><strong>${esc(opts.emptyTitle)}</strong><span>${esc(opts.emptyBody)}</span></div>`);
    return;
  }

  const max = Math.max(...pts.map(p=>p.y), opts.minMax||1);
  const iw = W-P.l-P.r, ih = H-P.t-P.b;
  const X = i => P.l + (pts.length===1 ? iw/2 : (i/(pts.length-1))*iw);
  const Y = v => P.t + ih - (v/max)*ih;

  const ticks = [0, max/2, max];
  let grid = ticks.map(t =>
    `<line x1="${P.l}" y1="${Y(t)}" x2="${W-P.r}" y2="${Y(t)}" stroke="var(--grid)" stroke-width="1"/>
     <text x="${P.l-8}" y="${Y(t)+4}" text-anchor="end" font-size="10" fill="var(--muted)"
       font-family="system-ui,sans-serif" style="font-variant-numeric:tabular-nums">${opts.fmtTick(t)}</text>`).join("");

  const line = pts.map((p,i)=>`${i?"L":"M"}${X(i)},${Y(p.y)}`).join(" ");
  const area = `${line} L${X(pts.length-1)},${Y(0)} L${X(0)},${Y(0)} Z`;
  const uid = "g"+Math.random().toString(36).slice(2,8);

  const first = pts[0].x, last = pts[pts.length-1].x;
  const dLabel = d => { const x=new Date(d+"T00:00:00");
    return x.toLocaleDateString("en-AU",{day:"numeric",month:"short"}); };

  el.insertAdjacentHTML("beforeend", `
    <svg class="plot" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img"
         aria-label="${esc(opts.title)}">
      <defs><linearGradient id="${uid}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${opts.color}" stop-opacity=".26"/>
        <stop offset="100%" stop-color="${opts.color}" stop-opacity="0"/>
      </linearGradient></defs>
      ${grid}
      <path d="${area}" fill="url(#${uid})"/>
      <path d="${line}" fill="none" stroke="${opts.color}" stroke-width="2"
            stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
      <line class="cross" x1="0" y1="${P.t}" x2="0" y2="${P.t+ih}" stroke="var(--baseline)"
            stroke-width="1" opacity="0"/>
      <circle class="cursor" r="4.5" fill="${opts.color}" stroke="var(--surface-1)"
              stroke-width="2" opacity="0"/>
      <line x1="${P.l}" y1="${P.t+ih}" x2="${W-P.r}" y2="${P.t+ih}" stroke="var(--baseline)" stroke-width="1"/>
      <text x="${P.l}" y="${H-6}" font-size="10" fill="var(--muted)" font-family="system-ui,sans-serif">${dLabel(first)}</text>
      <text x="${W-P.r}" y="${H-6}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="system-ui,sans-serif">${dLabel(last)}</text>
      <rect x="${P.l}" y="${P.t}" width="${iw}" height="${ih}" fill="transparent" class="hit"/>
    </svg>`);

  const svg=el.querySelector("svg"), hit=el.querySelector(".hit"),
        cross=el.querySelector(".cross"), cur=el.querySelector(".cursor"), tip=document.getElementById("tip");

  function move(ev){
    const r=svg.getBoundingClientRect();
    const sx=(ev.clientX-r.left)/r.width*W;
    let i=0,best=1e9;
    pts.forEach((p,k)=>{const d=Math.abs(X(k)-sx); if(d<best){best=d;i=k;}});
    const px=X(i), py=Y(pts[i].y);
    cross.setAttribute("x1",px); cross.setAttribute("x2",px); cross.setAttribute("opacity","1");
    cur.setAttribute("cx",px); cur.setAttribute("cy",py); cur.setAttribute("opacity","1");
    tip.innerHTML=`<div class="tdate">${dLabel(pts[i].x)}</div><div class="tval">${opts.fmtTip(pts[i].y)}</div>`;
    tip.style.opacity="1";
    const tr=tip.getBoundingClientRect();
    tip.style.left=Math.min(window.innerWidth-tr.width-8,
                    Math.max(8, ev.clientX-tr.width/2))+"px";
    tip.style.top=(ev.clientY-tr.height-14)+"px";
  }
  function leave(){cross.setAttribute("opacity","0");cur.setAttribute("opacity","0");
                   document.getElementById("tip").style.opacity="0";}
  hit.addEventListener("mousemove",move);
  hit.addEventListener("mouseleave",leave);
  hit.addEventListener("touchmove",e=>{if(e.touches[0])move(e.touches[0]);},{passive:true});
  hit.addEventListener("touchend",leave);
}

function render(d){
  const t=d.totals||{}, b=d.budget||{}, acct=d.account||{}, tg=d.targeting||{};
  const liveAds=(d.ads||[]).filter(a=>a.status==="ACTIVE").length;

  document.getElementById("livetxt").textContent =
    liveAds>0 ? `${liveAds} ad${liveAds>1?"s":""} live` : "Standing by";

  const up=new Date(d.updated_at||d.generated_at);
  document.getElementById("updated").textContent = "Updated " +
    up.toLocaleString("en-AU",{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"});

  document.getElementById("acctline").textContent =
    `${acct.name||""} · ${acct.currency||"AUD"} · ${acct.timezone||""}`;

  /* KPIs */
  const cpl=t.cost_per_lead;
  document.getElementById("kpis").innerHTML =
    kpiTile("Leads", int(t.leads),
      t.leads>0 ? "Enquiries captured" : "None yet — ads just went live", "var(--brand-2)") +
    kpiTile("Cost per lead", cpl?money(cpl):"—",
      cpl?"Average across all leads":"Shows once leads arrive", "var(--series-1)") +
    kpiTile("Total spend", money(t.spend),
      `Lifetime on this campaign`, "var(--series-2)") +
    kpiTile("Daily budget", money(b.daily_total,0),
      `About ${money(b.monthly_pace,0)} / month`, "var(--brand-1)");

  /* campaign */
  const c=(d.campaigns||[])[0]||{};
  const lf=d.lead_form||{};
  document.getElementById("campaigncard").innerHTML = `
    <div style="font-weight:660;font-size:1rem;letter-spacing:-.01em">${esc(c.name||"—")}</div>
    <div style="margin-top:3px;margin-bottom:10px">${statusPill(c.status)}</div>
    <div class="row"><span class="k">Goal</span><span class="v">${esc(c.objective||"—")}</span></div>
    <div class="row"><span class="k">Daily budget</span><span class="v">${money(b.daily_total,0)}</span></div>
    <div class="row"><span class="k">Ads running</span><span class="v">${liveAds} of ${(d.ads||[]).length}</span></div>
    <div class="row"><span class="k">Enquiry form</span><span class="v">${lf.status==="ACTIVE"?"Active":esc(lf.status||"—")}</span></div>
    <div class="row"><span class="k">Ad account</span><span class="v">${esc(acct.status||"—")}</span></div>`;

  document.getElementById("targetcard").innerHTML = `
    <div style="font-weight:660;font-size:1rem;letter-spacing:-.01em">Who we're reaching</div>
    <div style="margin-top:3px;color:var(--text-secondary);font-size:.875rem">
      Meta shows these ads to the people most likely to enquire, inside your catchment.</div>
    <div class="chips" style="margin-top:14px">
      ${tg.area?`<span class="chip">📍 ${esc(tg.area)}</span>`:""}
      ${tg.radius_km?`<span class="chip">${esc(tg.radius_km)} km radius</span>`:""}
      ${tg.age?`<span class="chip">Ages ${esc(tg.age)}</span>`:""}
      ${tg.advantage_audience?`<span class="chip">Smart audience on</span>`:""}
      <span class="chip">Facebook + Instagram</span>
    </div>
    <div class="row" style="margin-top:14px"><span class="k">People reached</span><span class="v">${int(t.reach)}</span></div>
    <div class="row"><span class="k">Times shown</span><span class="v">${int(t.impressions)}</span></div>
    <div class="row"><span class="k">Link clicks</span><span class="v">${int(t.clicks)}</span></div>`;

  /* charts — two separate single-series plots, never a dual axis */
  const daily=d.daily||[];
  lineChart(document.getElementById("leadschart"), daily, "leads", {
    title:"Leads per day", color:"var(--series-1)",
    fmtTick:v=>Math.round(v), fmtTip:v=>`${int(Math.round(v))} lead${Math.round(v)===1?"":"s"}`,
    fmtTotal:v=>`${int(v)} total`, padLeft:32, minMax:4,
    emptyTitle:"No lead data yet",
    emptyBody:"Your campaign went live today — daily results appear here from tomorrow."});
  lineChart(document.getElementById("spendchart"), daily, "spend", {
    title:"Spend per day", color:"var(--series-2)",
    fmtTick:v=>"$"+Math.round(v), fmtTip:v=>money(v), fmtTotal:v=>`${money(v)} total`,
    minMax:5,
    emptyTitle:"No spend yet",
    emptyBody:"Delivery starts as soon as Meta finishes reviewing your ads."});

  /* creatives */
  const imgs=d.images||{};
  document.getElementById("ads").innerHTML=(d.ads||[]).map(a=>{
    const src=a.image_hash&&imgs[a.image_hash]?imgs[a.image_hash]:null;
    const s=a.stats||{};
    return `<div class="card ad">
      <div class="adtop">
        ${src?`<img class="thumb" src="${src}" alt="${esc(a.name)}" loading="lazy">`
             :`<div class="thumb-ph">No preview</div>`}
        <div style="min-width:0">
          <div class="adname">${esc(a.name)}</div>
          <div class="adhead">${esc(a.headline||"")}</div>
          <div class="badges">
            ${statusPill(a.status)}
            <span class="badge">${esc(a.format)}</span>
            ${a.cta?`<span class="badge">${esc(String(a.cta).replace("_"," "))}</span>`:""}
          </div>
          <div class="adbody">${esc(a.body||"")}</div>
        </div>
      </div>
      <div class="adstats">
        <div class="adstat"><div class="n">${int(s.leads)}</div><div class="l">Leads</div></div>
        <div class="adstat"><div class="n">${int(s.impressions)}</div><div class="l">Shown</div></div>
        <div class="adstat"><div class="n">${int(s.clicks)}</div><div class="l">Clicks</div></div>
        <div class="adstat"><div class="n">${money(s.spend)}</div><div class="l">Spend</div></div>
      </div>
    </div>`;}).join("") ||
    `<div class="card pad" style="color:var(--muted)">No ads in this account yet.</div>`;
}

fetch(ENDPOINT,{cache:"no-store"})
  .then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json();})
  .then(render)
  .catch(err=>{
    document.getElementById("updated").textContent="Couldn't load live data";
    document.getElementById("kpis").innerHTML=
      `<div class="card pad" style="grid-column:1/-1;color:var(--text-secondary)">
        <strong style="color:var(--critical)">Dashboard temporarily unavailable.</strong><br>
        We couldn't reach the reporting service just now. Please refresh in a few minutes.
        <div style="color:var(--muted);font-size:.75rem;margin-top:6px">${esc(err.message)}</div>
      </div>`;
  });
</script>
</body>
</html>
